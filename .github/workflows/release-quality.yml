name: Release quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer test
      - run: composer check:php
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  runtime:
    name: Runtime checks (WP ${{ matrix.wordpress }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            wordpress: '6.2'
          - php: '8.4'
            wordpress: 'latest'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: wp-cli
          coverage: none
      - name: Install WordPress
        run: |
          mkdir -p /tmp/wordpress
          wp core download --path=/tmp/wordpress --version=${{ matrix.wordpress }}
          wp config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp core install --path=/tmp/wordpress --url=http://localhost --title=EasyRankly --admin_user=admin --admin_password=admin --admin_email=admin@example.test
          ln -s "$GITHUB_WORKSPACE" /tmp/wordpress/wp-content/plugins/easyrankly
          wp plugin activate easyrankly --path=/tmp/wordpress
      - name: P1 runtime suite
        run: wp eval-file "$GITHUB_WORKSPACE/tests/p1-runtime.php" --path=/tmp/wordpress

  release:
    name: Deterministic archive
    runs-on: ubuntu-latest
    needs: [static, runtime]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: zip
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Build twice
        run: |
          php bin/build-release.php --output=dist/easyrankly-first.zip --force
          php bin/build-release.php --output=dist/easyrankly-second.zip --force
          cmp dist/easyrankly-first.zip dist/easyrankly-second.zip
      - name: Verify archive
        run: php bin/verify-release.php --archive=dist/easyrankly-first.zip
      - uses: actions/upload-artifact@v4
        with:
          name: easyrankly-release-candidate
          path: |
            dist/easyrankly-first.zip
            dist/easyrankly-first.manifest.json
            dist/easyrankly-first.sha256

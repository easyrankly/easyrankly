name: Migration certification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    name: WordPress.org Plugin Check on distribution build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Stage WordPress.org distribution tree
        run: |
          install -d build/plugin-check/easyrankly
          rsync -a --delete --exclude-from=.distignore ./ build/plugin-check/easyrankly/

      - name: Run strict Plugin Check
        uses: WordPress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2 # v1.1.7
        with:
          build-dir: ./build/plugin-check/easyrankly
          slug: easyrankly
          strict: true

  certify:
    name: Free/PRO migration contract and PHP 8.0-8.5 runtime matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up certification PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2

      - name: Install static-analysis dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up CSS quality runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Check JavaScript and CSS quality
        run: npm ci --ignore-scripts --no-audit && npm run quality

      - name: Run complete migration certification
        run: composer migration:certify

      - name: Publish certification and go-live decision records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: migration-certification-${{ github.sha }}
          path: |
            tests/artifacts/migration-certification.json
            tests/artifacts/migration-go-live.json
            tests/artifacts/migration-test-results.tsv
          if-no-files-found: warn
          retention-days: 30
